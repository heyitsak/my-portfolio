<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d1f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f"/>
      <stop offset="100%" style="stop-color:#14142b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Decorative orbs -->
  <circle cx="100" cy="100" r="200" fill="url(#accentGrad)" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="500" r="250" fill="#8b5cf6" opacity="0.06" filter="url(#glow)"/>
  <circle cx="400" cy="300" r="180" fill="#3b82f6" opacity="0.04" filter="url(#glow)"/>

  <!-- Main Dashboard Card -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="640" height="440" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  </g>

  <!-- Browser Chrome -->
  <rect x="80" y="80" width="640" height="50" rx="20" fill="#1a1a3e"/>
  <rect x="80" y="110" width="640" height="20" fill="#1a1a3e"/>
  <circle cx="110" cy="105" r="8" fill="#ff5f57"/>
  <circle cx="135" cy="105" r="8" fill="#febc2e"/>
  <circle cx="160" cy="105" r="8" fill="#28c840"/>
  <rect x="200" y="97" width="300" height="20" rx="10" fill="#0f0f23"/>
  <text x="220" y="112" font-family="monospace" font-size="11" fill="#6b7280">localhost:3000/dashboard</text>

  <!-- Sidebar -->
  <rect x="80" y="130" width="180" height="390" fill="#14142b"/>

  <!-- Sidebar Logo -->
  <rect x="100" y="150" width="140" height="40" rx="8" fill="url(#accentGrad)" opacity="0.2"/>
  <text x="125" y="177" font-family="system-ui" font-size="16" fill="#a5b4fc" font-weight="bold">MVP Studio</text>

  <!-- Sidebar Menu Items -->
  <g opacity="0.9">
    <rect x="100" y="210" width="140" height="36" rx="8" fill="url(#accentGrad)"/>
    <rect x="115" y="222" width="16" height="12" rx="2" fill="#fff"/>
    <text x="140" y="233" font-family="system-ui" font-size="13" fill="#fff">Dashboard</text>
  </g>

  <g opacity="0.6">
    <rect x="115" y="262" width="16" height="16" rx="2" fill="#6b7280"/>
    <text x="140" y="275" font-family="system-ui" font-size="13" fill="#9ca3af">Analytics</text>
  </g>

  <g opacity="0.6">
    <rect x="115" y="298" width="16" height="16" rx="2" fill="#6b7280"/>
    <text x="140" y="311" font-family="system-ui" font-size="13" fill="#9ca3af">Users</text>
  </g>

  <g opacity="0.6">
    <rect x="115" y="334" width="16" height="16" rx="2" fill="#6b7280"/>
    <text x="140" y="347" font-family="system-ui" font-size="13" fill="#9ca3af">Settings</text>
  </g>

  <!-- Main Content Area -->
  <!-- Header -->
  <text x="285" y="170" font-family="system-ui" font-size="22" fill="#fff" font-weight="bold">Welcome back, Admin</text>
  <text x="285" y="195" font-family="system-ui" font-size="13" fill="#6b7280">Here's what's happening with your MVP</text>

  <!-- Stats Cards Row -->
  <g filter="url(#shadow)">
    <rect x="285" y="220" width="130" height="90" rx="12" fill="#1e1e3f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    <text x="305" y="250" font-family="system-ui" font-size="12" fill="#6b7280">Total Users</text>
    <text x="305" y="280" font-family="system-ui" font-size="28" fill="#fff" font-weight="bold">2,847</text>
    <text x="305" y="298" font-family="system-ui" font-size="11" fill="#10b981">↑ 12.5%</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="220" width="130" height="90" rx="12" fill="#1e1e3f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    <text x="450" y="250" font-family="system-ui" font-size="12" fill="#6b7280">Revenue</text>
    <text x="450" y="280" font-family="system-ui" font-size="28" fill="#fff" font-weight="bold">$48.2K</text>
    <text x="450" y="298" font-family="system-ui" font-size="11" fill="#10b981">↑ 8.1%</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="575" y="220" width="130" height="90" rx="12" fill="#1e1e3f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    <text x="595" y="250" font-family="system-ui" font-size="12" fill="#6b7280">Active Now</text>
    <text x="595" y="280" font-family="system-ui" font-size="28" fill="#fff" font-weight="bold">142</text>
    <circle cx="670" cy="270" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Chart Area -->
  <g filter="url(#shadow)">
    <rect x="285" y="330" width="280" height="170" rx="12" fill="#1e1e3f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    <text x="305" y="360" font-family="system-ui" font-size="14" fill="#fff" font-weight="600">User Growth</text>

    <!-- Chart Lines -->
    <path d="M305 450 Q350 420 400 400 T500 380 T545 360" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M305 450 Q350 420 400 400 T500 380 T545 360 L545 480 L305 480 Z" fill="url(#accentGrad)" opacity="0.1"/>

    <!-- Chart dots -->
    <circle cx="305" cy="450" r="4" fill="#6366f1"/>
    <circle cx="400" cy="400" r="4" fill="#6366f1"/>
    <circle cx="500" cy="380" r="4" fill="#6366f1"/>
    <circle cx="545" cy="360" r="4" fill="#6366f1"/>

    <!-- X-axis labels -->
    <text x="305" y="495" font-family="system-ui" font-size="10" fill="#6b7280">Mon</text>
    <text x="380" y="495" font-family="system-ui" font-size="10" fill="#6b7280">Wed</text>
    <text x="460" y="495" font-family="system-ui" font-size="10" fill="#6b7280">Fri</text>
    <text x="535" y="495" font-family="system-ui" font-size="10" fill="#6b7280">Sun</text>
  </g>

  <!-- Activity Feed -->
  <g filter="url(#shadow)">
    <rect x="575" y="330" width="130" height="170" rx="12" fill="#1e1e3f" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    <text x="595" y="360" font-family="system-ui" font-size="14" fill="#fff" font-weight="600">Activity</text>

    <!-- Activity items -->
    <circle cx="600" cy="390" r="4" fill="#10b981"/>
    <text x="615" y="394" font-family="system-ui" font-size="10" fill="#9ca3af">New signup</text>

    <circle cx="600" cy="420" r="4" fill="#3b82f6"/>
    <text x="615" y="424" font-family="system-ui" font-size="10" fill="#9ca3af">Payment</text>

    <circle cx="600" cy="450" r="4" fill="#8b5cf6"/>
    <text x="615" y="454" font-family="system-ui" font-size="10" fill="#9ca3af">API call</text>

    <circle cx="600" cy="480" r="4" fill="#f59e0b"/>
    <text x="615" y="484" font-family="system-ui" font-size="10" fill="#9ca3af">Deploy</text>
  </g>

  <!-- Floating Elements -->
  <g opacity="0.8" filter="url(#glow)">
    <rect x="650" y="50" width="120" height="60" rx="10" fill="#1e1e3f" stroke="url(#greenGrad)" stroke-width="2"/>
    <text x="670" y="75" font-family="system-ui" font-size="10" fill="#10b981">API Status</text>
    <text x="670" y="95" font-family="system-ui" font-size="16" fill="#fff" font-weight="bold">● Online</text>
  </g>

  <!-- Tech Stack Icons -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="640" height="40" rx="8" fill="#0f0f23" opacity="0.8"/>
    <text x="20" y="26" font-family="system-ui" font-size="12" fill="#6b7280">Built with:</text>
    <text x="100" y="26" font-family="monospace" font-size="12" fill="#3b82f6">Next.js</text>
    <text x="170" y="26" font-family="monospace" font-size="12" fill="#38bdf8">React</text>
    <text x="230" y="26" font-family="monospace" font-size="12" fill="#22c55e">Node.js</text>
    <text x="310" y="26" font-family="monospace" font-size="12" fill="#336791">PostgreSQL</text>
    <text x="410" y="26" font-family="monospace" font-size="12" fill="#f97316">Prisma</text>
    <text x="480" y="26" font-family="monospace" font-size="12" fill="#06b6d4">Tailwind</text>
  </g>
</svg>
